name: export desktop

on:
  workflow_dispatch:
  push:
    branches:
      - export-test

permissions:
  contents: read

concurrency:
  group: export-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: export ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows x86_64
            runner: windows-latest
            platform: windows
            arch: x86_64
            scons_args: use_mingw=yes
            preset: Windows Desktop
            output: exports/windows/tiles.exe
            artifact_path: exports/windows/
            artifact: tiles-windows-x86_64
          - label: linux x86_64
            runner: ubuntu-latest
            platform: linux
            arch: x86_64
            scons_args: ""
            preset: Linux
            output: exports/linux/tiles.x86_64
            artifact_path: exports/linux/
            artifact: tiles-linux-x86_64
          - label: macos universal
            runner: macos-latest
            platform: macos
            arch: universal
            scons_args: ""
            preset: macOS
            output: exports/macos/tiles.app
            artifact_path: exports/macos/
            artifact: tiles-macos-universal

    steps:
      - name: check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - if: matrix.platform == 'windows'
        name: install scons and mingw
        shell: bash
        run: |
          python -m pip install scons
          choco install mingw --no-progress

      - if: matrix.platform == 'linux'
        name: install scons
        run: sudo apt-get update && sudo apt-get install --yes scons

      - if: matrix.platform == 'macos'
        name: install scons
        run: brew install scons

      - if: matrix.platform == 'macos'
        name: build the debug gdextension for export validation
        run: scons platform=macos target=template_debug arch=universal

      - name: build the release gdextension
        shell: bash
        run: scons platform=${{ matrix.platform }} target=template_release arch=${{ matrix.arch }} ${{ matrix.scons_args }}

      - name: install godot 4.7.1 and its export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true

      - name: export the release build
        shell: bash
        run: |
          mkdir -p "$(dirname '${{ matrix.output }}')"
          godot --headless --path godot-project --export-release "${{ matrix.preset }}" "../${{ matrix.output }}"

      - name: publish the platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 2

  bundle:
    name: bundle all desktop exports
    needs: export
    runs-on: ubuntu-latest

    steps:
      - name: collect all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tiles-*
          path: tiles-desktop
          merge-multiple: false

      - name: publish the unified desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiles-desktop
          path: tiles-desktop/
          if-no-files-found: error
          retention-days: 2
