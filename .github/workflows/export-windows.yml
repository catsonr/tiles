name: export windows

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: build and export windows x86_64
    runs-on: windows-latest

    steps:
      - name: check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install scons and mingw
        shell: bash
        run: |
          python -m pip install scons
          choco install mingw --no-progress

      - name: build the release gdextension
        shell: bash
        run: |
          scons platform=windows target=template_release arch=x86_64

      - name: install godot 4.7.1 and its export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true

      - name: export the release build
        shell: bash
        run: |
          mkdir -p exports/windows
          godot --headless --path godot-project --export-release "Windows Desktop" ../exports/windows/tiles.exe

      - name: publish the windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiles-windows-x86_64
          path: exports/windows/
          if-no-files-found: error
          retention-days: 2
